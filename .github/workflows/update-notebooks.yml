name: Monthly Notebook Update

on:
  schedule:
    # Roda no dia 1 de cada mês às 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permite rodar manualmente para testar

permissions:
  contents: write

jobs:
  update-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Acelera execuções futuras

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ipython kernel install --name "python3" --user

      - name: Run Notebook 01
        run: |
          papermill 01_EDA_e_Extracao.ipynb 01_EDA_e_Extracao.ipynb --execution-timeout 1800

      - name: Run Notebook 02
        run: |
          papermill 02_Modelagem_Prophet.ipynb 02_Modelagem_Prophet.ipynb --execution-timeout 1800

      - name: Clean Colab Widgets
        run: |
          python scripts/clean_notebook_widgets.py 01_EDA_e_Extracao.ipynb 02_Modelagem_Prophet.ipynb

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automated monthly notebook update"
          branch: main
